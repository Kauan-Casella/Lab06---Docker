# Links de documentação oficial do Azure e do GitHub Actions para consulta externa
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

# Define o nome visível do fluxo de trabalho (workflow) no painel do GitHub Actions
name: Build and deploy Python app to Azure Web App - primeirodeployy

# Define as condições/gatilhos de inicialização automática da esteira (pipeline)
on:
  push:
    # O pipeline será disparado automaticamente sempre que houver um envio de código (push) para esta branch
    branches:
      - 'main'
  # Permite que o usuário execute este pipeline manualmente através da aba "Actions" no GitHub
  workflow_dispatch:

# Agrupamento de todos os trabalhos (jobs) sequenciais ou paralelos que o pipeline executará
jobs:
  # Primeiro Job: Responsável por preparar o ambiente, testar e empacotar a aplicação Python
  build:
    # Define o sistema operacional da máquina virtual onde as etapas do build vão rodar (Ubuntu Linux atualizado)
    runs-on: ubuntu-latest
    # Define as permissões de segurança que este job terá sobre o conteúdo do repositório no GitHub
    permissions:
      contents: read # Permissão de leitura obrigatória para clonar e inspecionar o código-fonte

    # Lista ordenada de ações e comandos que serão executados sequencialmente dentro do job de 'build'
    steps:
      # Etapa nativa do GitHub para clonar o código do seu repositório dentro da máquina virtual de trabalho
      - uses: actions/checkout@v4

      # --- INÍCIO DA ALTERAÇÃO (ITEM 3 DO EXERCÍCIO) ---
      # Novo 'step' simples adicionado antes do build para exibir uma mensagem informativa no painel
      - name: Print Console Message
        run: echo "Iniciando o deploy do meu projeto!"
      # --- FIM DA ALTERAÇÃO ---

      # Etapa que configura a versão específica do interpretador Python na máquina virtual
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Define que o ambiente utilizará a versão 3.14 do Python

      # Seção opcional para simular e validar a compilação do projeto localmente na máquina virtual
      # Ajuda a capturar erros de dependências ou sintaxe antes de enviar os arquivos finais para a nuvem da Azure
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv # Cria uma pasta isolada chamada 'antenv' para gerenciar as dependências do projeto
          source antenv/bin/activate # Ativa esse ambiente virtual Python recém-criado
          pip install -r requirements.txt # Instala todas as bibliotecas listadas no arquivo requirements.txt
                
      # Etapa que salva os arquivos do projeto gerados no build para que possam ser usados pelo job de deploy
      # Por padrão, a Azure usa a engine Oryx para compilar o código diretamente na nuvem durante o deploy. 
      # Sendo assim, a pasta do ambiente virtual local (antenv) é ignorada aqui para reduzir o peso do arquivo final.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app # Nome descritivo do pacote compactado gerado (.zip)
          path: |
            .
            !antenv/ # O caractere '!' indica para excluir a pasta de ambiente virtual do upload

      # Dica de configuração: Se preferir desativar a compilação Oryx automática na nuvem Azure, você deve:
      # 1. Remover a variável SCM_DO_BUILD_DURING_DEPLOYMENT das configurações do seu App Service na Azure.
      # 2. Consultar os exemplos oficiais de fluxos alternativos no link: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  # Segundo Job: Responsável por pegar o pacote gerado pelo build e publicar no servidor do Azure
  deploy:
    # Define o sistema operacional da máquina virtual onde as etapas do deploy vão rodar
    runs-on: ubuntu-latest
    # Garante que o deploy só comece APÓS o job de 'build' terminar com sucesso total
    needs: build
    # Permissões extras para autenticação segura com servidores externos sem expor senhas diretas
    permissions:
      id-token: write # Permissão necessária para solicitar e validar tokens JSON Web Token (JWT) com a Azure
      contents: read # Permissão de leitura básica para verificação de metadados do repositório

    # Lista ordenada de ações e comandos que serão executados sequencialmente dentro do job de 'deploy'
    steps:
      # Etapa que faz o download do pacote comprimido do projeto gerado anteriormente no job de build
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app # Deve ser exatamente o mesmo nome definido no 'upload-artifact'

      # Realiza o login na conta corporativa/estudantil da Azure usando segredos (secrets) configurados no GitHub
      - name: Login to Azure
        uses: azure/login@v2
        with:
          # Variáveis criptografadas que autenticam sua aplicação com segurança no seu painel da Azure
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E00306BEC76E4E6B8FF9EB4518700A5A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B2920EC1680C4958959B506E6C1ED97F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_789702403E0B476694B58C769E7493A0 }}

      # Etapa final que publica os arquivos do projeto diretamente no serviço de hospedagem de aplicativos da Azure
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp # ID interno do step para monitorar o status do envio se necessário
        with:
          app-name: 'primeirodeployy' # O nome exato do recurso App Service criado por você no painel da Azure
          slot-name: 'Production' # Define que a publicação irá direto para o ambiente de produção principal
